name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # The main ruleset requires a pull request, and GitHub Actions cannot
        # be added to its bypass list because Actions is not an installable
        # App. A write-enabled deploy key can, via actor_type DeployKey, and
        # is repo-scoped rather than account-scoped like a PAT. Without this
        # the push below fails with GH013.
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate version
        # Runs before anything mutates npm, git or the working tree: the value
        # is interpolated into later shell and JS, and a malformed one would
        # otherwise surface only after the tag or package was already public.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected strict x.y.z)"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Bump version
        run: |
          cd packages/opensoma
          bun -e "
            const fs = require('fs');
            const v = '${{ inputs.version }}';
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            let readme = fs.readFileSync('../../README.md', 'utf8');
            readme = readme.replace(/opensoma@[\d.]+/g, 'opensoma@' + v);
            fs.writeFileSync('../../README.md', readme);
            const pluginJson = JSON.parse(fs.readFileSync('../../.claude-plugin/plugin.json', 'utf8'));
            pluginJson.version = v;
            fs.writeFileSync('../../.claude-plugin/plugin.json', JSON.stringify(pluginJson, null, 2) + '\n');
            for (const dir of fs.readdirSync('../../skills')) {
              const p = '../../skills/' + dir + '/SKILL.md';
              if (fs.existsSync(p)) {
                let s = fs.readFileSync(p, 'utf8');
                s = s.replace(/^version: .+$/m, 'version: ' + v);
                fs.writeFileSync(p, s);
              }
            }
          "

      - name: Publish to npm
        # Publishing before tagging means a failed publish leaves no tag
        # behind. The previous order tagged first, so a rejected push stranded
        # a tag on a commit that was never published and blocked the re-run.
        # npm versions are immutable, so a re-run treats an existing version
        # as success and continues on to repair the tag and release.
        run: |
          cd packages/opensoma
          if [ -n "$(npm view opensoma@${{ inputs.version }} version 2>/dev/null || true)" ]; then
            echo "opensoma@${{ inputs.version }} already published, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/opensoma/package.json README.md .claude-plugin/plugin.json
          if [ -d skills ]; then git add skills/*/SKILL.md; fi
          git diff --staged --quiet || git commit -m "${{ inputs.version }}"
          git push origin HEAD
          git tag -f "${{ inputs.version }}"
          git push --force origin "refs/tags/${{ inputs.version }}"

      - name: Create GitHub Release
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ inputs.version }} already exists, skipping"
          else
            gh release create "${{ inputs.version }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
